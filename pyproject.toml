[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-secrets"
version = "3.0.4"
description = "The easy way of handling Django secrets."
readme = "README.rst"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Andy Grabow", email = "andy@freilandkiwis.de" },
]
keywords = ["keys", "key", "secret", "secrets", "Django", "deployment"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django (>=6.0.5)",
    "six (>=1.17.0)",
]

[project.urls]
Homepage = "https://github.com/kakulukia/django-secrets"
Download = "https://github.com/kakulukia/django-secrets/tarball/3.0.4"

[dependency-groups]
dev = [
    "bump-my-version (>=1.3.0)",
    "codecov>=2.1.13",
    "coverage (>=7.14.0)",
    "ipdb (>=0.13.13)",
    "pytest (>=9.0.3)",
    "ruff (>=0.15.13)",
    "wheel (>=0.47.0)",
]

[tool.setuptools.packages.find]
include = ["django_secrets*"]

[tool.ruff]
line-length = 140
exclude = [
    ".git",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F"]

[tool.bumpversion]
current_version = "3.0.4"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "django_secrets/__init__.py"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''name = "django-secrets"
version = "{current_version}"'''
replace = '''name = "django-secrets"
version = "{new_version}"'''
